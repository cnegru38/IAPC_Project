server:
  port: 8081

spring:
  application:
    name: edupulse
  config:
    import: optional:classpath:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/edupulse
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2
          temperature: 0.7
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768