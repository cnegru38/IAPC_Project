server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: edupulse
              uri: http://localhost:8081
              predicates:
                - Path=/api/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka